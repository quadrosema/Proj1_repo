<!DOCTYPE html>
<html>
<head>
    <title>AI Bio Generator</title>
</head>
<body>
    <h1>AI Bio Generator</h1>

    <form method="POST">
        <label>Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Role:</label><br>
        <input type="text" name="role" required><br><br>

        <label>Hobbies:</label><br>
        <input type="text" name="hobbies" required><br><br>

        <button type="submit">Generate Bio</button>
    </form>

    {% if bio %}
        <h2>Generated Bio</h2>
        <p>{{ bio }}</p>
    {% endif %}
</body>
</html>
